<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F4072" />
  <title>A2Zee - Offline Mode</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFF6F0;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 1.75rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(31, 64, 114, 0.08), 0 8px 10px -6px rgba(31, 64, 114, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1F4072;
      color: #FFFFFF;
      padding: 0.375rem 1rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .icon-wrapper {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.25rem;
      background: #EFF6FF;
      color: #1F4072;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .icon-wrapper svg {
      width: 2.5rem;
      height: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #64748B;
    }
    .btn {
      margin-top: 0.5rem;
      background: #1F4072;
      color: #FFFFFF;
      border: none;
      border-radius: 1rem;
      padding: 0.875rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(31, 64, 114, 0.2);
    }
    .btn:hover {
      background: #163056;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer-note {
      font-size: 0.75rem;
      color: #94A3B8;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-pill">
      <span>A2Zee Cooperative</span>
    </div>

    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>

    <h1>Internet Connection Lost</h1>
    <p>
      You are currently offline. A2Zee requires an active network connection to dispatch verified artisans, track live GPS locations, and process cooperative bookings.
    </p>

    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="footer-note">
      Cached pages and emergency contacts remain accessible.
    </div>
  </div>
</body>
</html>
